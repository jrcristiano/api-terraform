name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      IMAGE_TAG: ${{ github.sha }}
      ECR_URL: ${{ secrets.ECR_REPOSITORY_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URL

      - name: Build and tag Docker image
        run: |
          docker build -t api-terraform-app .
          docker tag api-terraform-app $ECR_URL:latest
          docker tag api-terraform-app $ECR_URL:$IMAGE_TAG

      - name: Push images to ECR
        run: |
          docker push $ECR_URL:latest
          docker push $ECR_URL:$IMAGE_TAG

      - name: Setup Ansible
        run: |
          python3 -m pip install --user ansible

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ansible_key
          chmod 600 ~/.ssh/ansible_key

      - name: Deploy with Ansible
        id: deploy
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          echo "${{ secrets.EC2_HOST }}" > ansible_host.txt

          ansible-playbook -i "$(cat ansible_host.txt)," \
            -u ubuntu \
            --private-key ~/.ssh/ansible_key \
            -e "ecr_repository_url=${{ secrets.ECR_REPOSITORY_URL }}" \
            -e "aws_region=${{ env.AWS_REGION }}" \
            -e "image_tag=${{ env.IMAGE_TAG }}" \
            ansible/playbook.yml

      - name: Smoke test
        id: smoke
        run: |
          echo "Waiting for container to be healthy..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://${{ secrets.EC2_HOST }}/api/posts || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed — HTTP $STATUS"
              exit 0
            fi
            echo "Attempt $i/12 — HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Smoke test FAILED after 12 attempts"
          exit 1

      - name: Rollback with Ansible
        if: failure() && steps.deploy.outcome == 'success'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          PREVIOUS_IMAGE=$(ansible all -i "$(cat ansible_host.txt)," \
            -u ubuntu --private-key ~/.ssh/ansible_key \
            -m ansible.builtin.shell \
            -a "cat /home/ubuntu/.previous-image" | tail -1)

          ansible-playbook -i "$(cat ansible_host.txt)," \
            -u ubuntu \
            --private-key ~/.ssh/ansible_key \
            -e "ecr_repository_url=${{ secrets.ECR_REPOSITORY_URL }}" \
            -e "aws_region=${{ env.AWS_REGION }}" \
            -e "image_tag=latest" \
            ansible/playbook.yml
