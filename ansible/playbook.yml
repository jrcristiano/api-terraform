---
- name: Provision and deploy api-terraform on EC2
  hosts: app
  become: yes
  vars:
    app_port: 80
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"
    aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default('') }}"
    aws_secret_access_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default('') }}"

  tasks:
    - name: Install required system packages
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - unzip
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Check if AWS CLI v2 is installed
      command: which aws
      register: aws_check
      failed_when: false
      changed_when: false

    - name: Download AWS CLI v2
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: aws_check.rc != 0

    - name: Unzip AWS CLI v2
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes
      when: aws_check.rc != 0

    - name: Install AWS CLI v2
      command: /tmp/aws/install
      register: aws_install
      changed_when: "'exists' not in aws_install.stderr"
      when: aws_check.rc != 0

    - name: Clean up AWS CLI installer
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/awscliv2.zip
        - /tmp/aws
      when: aws_check.rc != 0

    - name: Copy nginx config
      copy:
        src: ../nginx.conf
        dest: /home/ubuntu/nginx.conf
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Template docker-compose file
      template:
        src: docker-compose.yml.j2
        dest: /home/ubuntu/docker-compose.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Log in to Amazon ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ ecr_repository_url }}
      args:
        executable: /bin/bash
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"

    - name: Pull container images
      shell: |
        cd /home/ubuntu && docker compose pull

    - name: Save current image tag for rollback
      shell: |
        RUNNING_IMAGE=$(docker ps -q --filter "name=api" | head -1 | xargs -r docker inspect --format='{% raw %}{{.Config.Image}}{% endraw %}' || true)
        if [ -n "$RUNNING_IMAGE" ]; then
          echo "$RUNNING_IMAGE" > /home/ubuntu/.previous-image
          echo "Saved previous image: $RUNNING_IMAGE"
        else
          echo "{{ ecr_repository_url }}:latest" > /home/ubuntu/.previous-image
          echo "No running container found; fallback to latest"
        fi

    - name: Start containers
      shell: |
        cd /home/ubuntu && docker compose up -d --force-recreate
